function triageRow(it){
  const cur=state.decisions[it.id];const sug=it.suggested;
  const wrap=el('div');
  function btn(kind,def){
    const active=cur&&cur.kind===kind;const suggested=!active&&sug&&sug.kind===kind;
    let label=def.label;
    if(active&&kind==='defer'&&cur.until)label='Demorado → '+fmt(cur.until);
    if(active&&kind==='waiting'&&cur.until)label='Tejado → revisar '+fmt(cur.until);
    const b=el('button',{style:active?{background:def.bg,color:def.color,borderColor:def.bg}:suggested?{border:'1px dashed '+def.bg,color:def.bg}:{}},(active?'✓ ':'')+label);
    b.addEventListener('click',()=>{
      if(active){setDecision(it.id,null);return;}
      if(kind==='defer'){pendingDefer[it.id]=true;render();return;}
      delete pendingDefer[it.id];
      if(kind==='waiting'){setDecision(it.id,{kind:'waiting',who:it.waitingWho||(sug&&sug.who)||"",until:(sug&&sug.kind==='waiting'&&sug.until)||null});return;}
      setDecision(it.id,{kind});
    });
    return b;
  }
  const r1=el('div',{class:'tri'},el('span',{class:'lab'},'CUÁNDO'),...Object.entries(TRIAGE_WHEN).map(([k,d])=>btn(k,d)));
  const r2=el('div',{class:'tri'},el('span',{class:'lab'},'ESTADO'),...Object.entries(TRIAGE_STATE).map(([k,d])=>btn(k,d)));
  wrap.append(r1,r2);
  if(pendingDefer[it.id]){
    const p=el('div',{class:'picker'},'Demorar hasta: ');
    DATE_CHIPS.forEach(c=>p.appendChild(el('button',{onclick:()=>{delete pendingDefer[it.id];setDecision(it.id,{kind:'defer',until:addDays(c.days)});}},c.label)));
    const inp=el('input',{type:'date'});inp.addEventListener('change',()=>{if(inp.value){delete pendingDefer[it.id];setDecision(it.id,{kind:'defer',until:inp.value});}});
    p.appendChild(inp);
    p.appendChild(el('button',{onclick:()=>{delete pendingDefer[it.id];render();}},'cancelar'));
    wrap.appendChild(p);
  }
  if(cur&&cur.kind==='waiting'){
    const p=el('div',{class:'picker'});
    const who=el('input',{type:'text',placeholder:'¿de quién?',value:cur.who||'',style:{width:'150px'}});
    who.addEventListener('input',()=>{state.decisions[it.id].who=who.value;saveState();updateSynth();});
    p.append(who,' revisar el… ');
    DATE_CHIPS.forEach(c=>p.appendChild(el('button',{onclick:()=>{state.decisions[it.id].until=addDays(c.days);saveState();render();}},c.label)));
    const inp=el('input',{type:'date',value:cur.until||''});inp.addEventListener('change',()=>{state.decisions[it.id].until=inp.value||null;saveState();render();});
    p.appendChild(inp);
    wrap.appendChild(p);
  }
  return wrap;
}

  // synth
  const sb=el('section',{id:'synthBox'});
  const h=el('h2',{style:{cursor:'pointer'}},(state.synthOpen?'▾ ':'▸ ')+'Síntesis ejecutable');h.addEventListener('click',()=>{state.synthOpen=!state.synthOpen;saveState();render();});
  sb.appendChild(h);
  if(state.synthOpen){
    const ta=el('textarea',{id:'synthTa',readonly:'readonly'});ta.value=synthText();sb.appendChild(ta);
    const cb=el('button',{id:'copyBtn'},'Copiar síntesis');
    cb.addEventListener('click',()=>{const text=synthText();const btn=cb;const done=()=>{btn.classList.add('copied');btn.textContent='✓ Copiado';setTimeout(()=>{btn.classList.remove('copied');btn.textContent='Copiar síntesis';},2000);};const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);done();};if(navigator.clipboard)navigator.clipboard.writeText(text).then(done).catch(fallback);else fallback();});
    const rb=el('button',{id:'resetBtn'},'Resetear decisiones guardadas');
    rb.addEventListener('click',()=>{if(confirm('¿Borrar todas las decisiones e instrucciones guardadas de este briefing?')){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}state=initState();pendingDefer={};saveState();render();}});
    sb.append(el('div',null,cb,rb),el('div',{class:'hint'},'Tus decisiones e instrucciones se guardan en este navegador (localStorage). Persisten al cerrar la pestaña. Abre siempre este mismo archivo; si lo descargas de nuevo, el estado no viaja con él.'));
  }
  app.appendChild(sb);
  if(storageOk&&localStorage.getItem(STORAGE_KEY))markSaved();
}
render();
</script>
</body>
</html>
